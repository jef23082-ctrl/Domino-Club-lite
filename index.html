<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Le Roi du Cochon — Domino Club V3">
  <title>Le Roi du Cochon — Casino V3</title>
  <link rel="stylesheet" href="./styles/foundation.css?v=20260903T071755351">
  <link rel="stylesheet" href="./styles/casino-scene.css?v=20260903T071755351">
  <link rel="stylesheet" href="./styles/dominoes.css?v=20260903T071755351">
  <link rel="stylesheet" href="./styles/interface.css?v=20260903T071755351">
  <link rel="stylesheet" href="./styles/responsive.css?v=20260903T071755351">
  <link rel="stylesheet" href="./styles/online.css?v=20260903T071755351">
  <link rel="stylesheet" href="./styles/portal.css?v=20260903T071755351">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="game-shell" class="game-shell" aria-label="Partie de dominos en ligne">
      <div id="casino-stage" class="casino-stage">
        <img class="scene-base" src="./assets/scene/casino-base-v1.png?v=20260903T071755351" alt="Salon de casino privé avec table de dominos">
        <img id="character-top" class="scene-player-plate scene-player-plate--top" hidden alt="">
        <img id="character-left" class="scene-player-plate scene-player-plate--left" hidden alt="">
        <img id="character-right" class="scene-player-plate scene-player-plate--right" hidden alt="">
        <div class="scene-vignette" aria-hidden="true"></div>

        <div id="seat-top" class="player-seat player-seat--top" data-seat="top"></div>
        <div id="seat-left" class="player-seat player-seat--left" data-seat="left"></div>
        <div id="seat-right" class="player-seat player-seat--right" data-seat="right"></div>

        <div class="board-plane">
          <svg id="domino-board" class="domino-board" viewBox="0 0 1500 440" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Chaîne de dominos joués"></svg>
        </div>

        <div class="turn-banner" aria-live="polite"><span>Bienvenue au club</span></div>

        <section class="hand-dock" aria-label="Main du joueur">
          <button id="play-left" class="edge-action edge-action--left" type="button" disabled><span aria-hidden="true">←</span><span>Jouer à gauche</span></button>
          <div id="player-hand" class="player-hand"></div>
          <button id="play-right" class="edge-action edge-action--right" type="button" disabled><span>Jouer à droite</span><span aria-hidden="true">→</span></button>
        </section>
        <p id="hand-reorder-hint" class="sr-only">Un clic joue le premier domino ou un domino avec un seul côté possible. Si les deux côtés sont possibles, sélectionnez-le puis choisissez gauche ou droite. Pour ranger la main sans jouer, faites glisser le domino ou utilisez Alt et les flèches gauche et droite.</p>
        <p id="hand-reorder-status" class="sr-only" role="status"></p>

        <button id="pass-button" class="pass-button" type="button" disabled>BOUDÉÉÉ</button>

        <button id="fullscreen-button" class="fullscreen-button" type="button" aria-label="Afficher en plein écran" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg>
        </button>

        <aside id="chat-panel" class="chat-panel" aria-label="Discussion">
          <header class="chat-heading">
            <span class="chat-heading-rule" aria-hidden="true"></span>
            <h2>Discussion</h2>
            <button id="chat-toggle" type="button" aria-label="Replier la discussion" aria-expanded="true">›</button>
          </header>
            <div class="chat-messages" aria-live="polite"></div>
            <p id="scene-typing" class="scene-typing" aria-live="polite"></p>
          <form class="chat-form">
            <label class="sr-only" for="chat-input">Écrire un message</label>
            <input id="chat-input" maxlength="300" placeholder="Écrivez un message…">
            <button type="submit" aria-label="Envoyer">➜</button>
          </form>
        </aside>
      </div>
    </section>
  </main>
    <script type="module" src="./src/main.js?v=20260903T071755351"></script>
</body>
</html>
